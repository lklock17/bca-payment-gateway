<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'%3E%3Cpath d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z'/%3E%3Cpath d='M9 12l2 2 4-4'/%3E%3C/svg%3E">
  <title>Login - BCA Payment Gateway</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <div class="auth-logo" aria-hidden="true">
          <!-- FinTech BCA Gateway Shield / Circuit Logo -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h1 class="auth-title">BCA Gateway</h1>
        <p class="auth-subtitle">Self-Hosted Enterprise Payment Gateway</p>
      </div>

      <!-- DEMO_HINT_START -->
      <!-- Quick Fill Demo Credentials Bar -->
      <div class="auth-hint-box">
        <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--bca-cyan); flex-shrink: 0;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            <span style="color: #ffffff; font-weight: 600;">Demo:</span>
            <span class="font-mono" style="color: var(--text-secondary);">admin@gateway.com</span>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="fillDemoBtn" style="height: 26px; min-height: 26px; padding: 0 9px; font-size: 11.5px; flex-shrink: 0;">
          Isi Otomatis
        </button>
      </div>
      <!-- DEMO_HINT_END -->

      <form id="loginForm" style="margin-top: 16px;">
        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <div class="input-icon-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="email" class="form-control" placeholder="nama@perusahaan.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Kata Sandi</label>
            <span style="font-size: 11px; color: var(--text-muted);">Min. 6 karakter</span>
          </div>
          <div class="input-icon-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="input-action-btn" id="togglePasswordBtn" title="Tampilkan sandi" aria-label="Tampilkan sandi">
              <svg id="eyeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginErrorBox" class="error-banner" role="alert" style="display: none; margin-bottom: 12px; padding: 8px 12px; font-size: 12px;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top: 10px;">
          <span class="spinner-inline" id="submitSpinner" style="display: none;"></span>
          <span id="submitText">Masuk ke Panel Gateway</span>
          <svg id="submitArrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-links">
        <a href="/docs.html" class="auth-link-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Dokumentasi API
        </a>
        <a href="/tester.html" class="auth-link-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          API Tester
        </a>
      </div>
    </div>

    <!-- Security & Status watermark -->
    <div style="margin-top: 18px; text-align: center; color: var(--text-muted); font-size: 11.5px;">
      <span style="display: inline-flex; align-items: center; gap: 6px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--success);"></span>
        Sistem KlikBCA Scraper &amp; QRIS Dinamis Aktif
      </span>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/ui-core.js"></script>
  <script>
    // Redirect if session already exists
    if (localStorage.getItem('gateway_token')) {
      window.location.href = '/dashboard.html';
    }

    const showToast = (msg, type) => window.BcaUI.showToast(msg, type);
    const loginErrorBox = document.getElementById('loginErrorBox');

    function showLoginError(msg) {
      if (!msg) {
        loginErrorBox.style.display = 'none';
        loginErrorBox.textContent = '';
        return;
      }
      loginErrorBox.textContent = msg;
      loginErrorBox.style.display = 'flex';
    }

    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePasswordBtn.setAttribute('title', isPassword ? 'Sembunyikan sandi' : 'Tampilkan sandi');
      togglePasswordBtn.innerHTML = isPassword 
        ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });

    <!-- DEMO_SCRIPT_START -->
    // Auto-fill demo credentials (stripped in NODE_ENV=production)
    const fillDemoBtn = document.getElementById('fillDemoBtn');
    if (fillDemoBtn) {
      fillDemoBtn.addEventListener('click', () => {
        document.getElementById('email').value = 'admin@gateway.com';
        document.getElementById('password').value = 'admin123';
        showToast('Kredensial demo terisi: admin@gateway.com');
      });
    }
    <!-- DEMO_SCRIPT_END -->

    // Form submit handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showLoginError('');
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const submitSpinner = document.getElementById('submitSpinner');
      const submitArrow = document.getElementById('submitArrow');
      
      submitBtn.disabled = true;
      submitSpinner.style.display = 'inline-block';
      submitArrow.style.display = 'none';
      submitText.innerText = 'Menghubungkan...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          showToast('Login berhasil! Mengalihkan ke dashboard...');
          localStorage.setItem('gateway_token', data.token);
          localStorage.setItem('user_email', data.email);
          localStorage.setItem('user_role', data.role);
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          const msg = data.message || 'Email atau kata sandi tidak valid';
          showLoginError(msg);
          showToast(msg, 'error');
          submitBtn.disabled = false;
          submitSpinner.style.display = 'none';
          submitArrow.style.display = 'inline-block';
          submitText.innerText = 'Masuk ke Panel Gateway';
        }
      } catch (err) {
        const msg = 'Gagal menghubungi server gateway. Periksa koneksi Anda.';
        showLoginError(msg);
        showToast(msg, 'error');
        submitBtn.disabled = false;
        submitSpinner.style.display = 'none';
        submitArrow.style.display = 'inline-block';
        submitText.innerText = 'Masuk ke Panel Gateway';
      }
    });
  </script>
</body>
</html>
