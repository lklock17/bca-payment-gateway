<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BCA Payment Gateway</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <!-- Custom SVG BCA Payment Gateway logo -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
          </svg>
        </div>
        <h1 class="auth-title">BCA Gateway</h1>
        <p class="auth-subtitle">Login ke Panel Admin</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
          <span>Masuk</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--card-border); padding-top: 16px;">
        <a href="/docs.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-secondary)'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          Dokumentasi API (Publik)
        </a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('gateway_token')) {
      window.location.href = '/dashboard.html';
    }

    const toastContainer = document.getElementById('toastContainer');
    
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <div style="font-weight: 500;">${message}</div>
      `;
      toastContainer.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btn.querySelector('span').innerText = 'Menghubungkan...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          showToast('Login berhasil! Mengalihkan...');
          localStorage.setItem('gateway_token', data.token);
          localStorage.setItem('user_email', data.email);
          localStorage.setItem('user_role', data.role);
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          showToast(data.message || 'Email atau password salah', 'error');
          btn.disabled = false;
          btn.style.opacity = '1';
          btn.querySelector('span').innerText = 'Masuk';
        }
      } catch (err) {
        showToast('Gagal terhubung ke server', 'error');
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.querySelector('span').innerText = 'Masuk';
      }
    });
  </script>
</body>
</html>
